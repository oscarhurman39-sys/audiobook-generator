name: E2E Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    # Five generation tests can each take up to ~95 s and retry twice on CI, so a
    # single failing one blew the old 5-minute cap and cancelled the job before
    # the artifact step ran. Enough headroom for the worst case, not the norm.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build app
        run: pnpm build
        continue-on-error: true

      - name: Run E2E smoke tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload test artifacts
        # always(): a job that hits timeout-minutes counts as cancelled, not
        # failed, and failure() would skip the upload exactly when it matters.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
